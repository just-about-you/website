# Deploys this directory to GitHub Pages on every push to main.
#
# The site has no build step — GitHub Pages serves the repo root as-is, which is
# what README.md describes. So there is nothing to compile; the only thing worth
# doing before publishing is refusing to publish a broken page.
#
# Free on public repositories. On a private repo, Pages needs GitHub Pro/Team
# and the run consumes Actions minutes.
name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queue rather than cancel: a push landing mid-deploy
# should still ship, not be silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs on pull requests too, so a broken link is caught before merge
  # rather than after it is live.
  check:
    name: Y140 gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every script here is stdlib-only by design, so there is no install step
      # and nothing to pin.

      # Exits 1 on: a dead internal link, an image that does not resolve, an
      # image with no alt text, an external host outside the Google Fonts
      # allowlist, or an image the capture manifest omits.
      - name: Links, alt text, external hosts, capture manifest
        run: python scripts/check.py

      # KK127. The app has been guarded against these sentences since M123
      # shipped and this site was not, which is how `privacy.html` came to
      # publish the exact string `app/test/what_leaves_phone_test.dart` exists
      # to keep out of shipped copy. It caught 18 of them on first run.
      #
      # This runs here rather than inside check.py so that a failure names
      # itself: "the site published a forbidden absolute" is a different
      # conversation from "a link is dead", and burying it in a general gate
      # is how the last one went unnoticed.
      - name: Forbidden absolutes
        run: python scripts/absolutes.py

      # accessibility.html claims colour contrast is checked before the site
      # goes anywhere. It was not — contrast.py existed and nothing ran it —
      # so either the claim or the process had to change, and the process was
      # the cheaper half. It passes on the current tokens with room to spare.
      #
      # `scripts/reflow.html` is deliberately NOT here. It is a browser harness
      # that needs a real engine and `--allow-file-access-from-files`, it
      # covers five of the nineteen pages, and wiring it as a headless step
      # would mean either a browser dependency in a stdlib-only gate or a
      # weakened check that passes without measuring. accessibility.html now
      # says plainly that reflow is run by hand and on which pages, which is
      # the honest half of the fix until the harness covers everything.
      - name: WCAG contrast, computed from the tokens
        run: python scripts/contrast.py

  deploy:
    name: Publish
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be enabled on the repository, with
      #   Settings > Pages > Build and deployment > Source = "GitHub Actions".
      #
      # This cannot be done from the workflow. `enablement: true` was tried on
      # run #3 and the API refused it -- "Create Pages site failed. Error:
      # Resource not accessible by integration" -- because creating a Pages
      # site is an admin-level call and GITHUB_TOKEN's `pages: write` does not
      # cover it. It was removed rather than left in as a call that can only
      # fail; once Pages is on, it would be a no-op anyway.
      - uses: actions/configure-pages@v5

      # path '.' matches README.md's "GitHub Pages serves this directory
      # as-is". .git is excluded by the action; scripts/ and README.md ship,
      # which is harmless on a repo that is already public.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
